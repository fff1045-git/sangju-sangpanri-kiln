<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕실 도자기 맞추기</title>
<meta name="description" content="상주 상판리 가마터 왕실 분청사기 파편 맞추기 퍼즐">
<style>
:root{
  --paper:#f6f3ee; --ink:#23211d; --clay:#a8683f; --moss:#4f6f63;
  --card:#fffdf9; --board:#efe9de; --line:rgba(35,33,29,.13); --muted:#6f6a61;
  --shadow:0 8px 28px rgba(35,33,29,.09);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1d1b18; --ink:#ece7dd; --clay:#d19a6c; --moss:#8fb3a4;
    --card:#27241f; --board:#211f1b; --line:rgba(236,231,221,.14); --muted:#a9a297;
    --shadow:0 8px 28px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Pretendard,"Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 44px}
header h1{margin:0 0 6px;font-size:clamp(22px,4vw,32px);letter-spacing:-.02em}
header h1 span{color:var(--clay)}
header p{margin:0 0 16px;color:var(--muted);line-height:1.55}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lv{flex:1 1 150px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;padding:10px 14px;cursor:pointer;font:inherit;text-align:left;
  transition:border-color .15s,box-shadow .15s}
.lv b{font-size:15px}
.lv small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.lv:hover{border-color:var(--moss)}
.lv.active{border-color:var(--clay);box-shadow:0 0 0 3px rgba(168,104,63,.16)}
.lv.cleared small::after{content:" · 완성";color:var(--moss);font-weight:700}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;
  font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.stat b{color:var(--clay)}
.sp{flex:1}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:8px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--moss)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.boardwrap{background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
#board{display:block;width:100%;border-radius:14px;touch-action:none;background:var(--board);
  cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#board.dragging{cursor:grabbing}
.foot{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.55}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);display:none;align-items:center;
  justify-content:center;padding:16px;z-index:10;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:22px;padding:28px 24px 24px;max-width:430px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.modal img{width:min(260px,66vw);aspect-ratio:1;border-radius:18px;display:block;margin:0 auto 16px;
  animation:glow 2.6s ease-in-out infinite}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(168,104,63,.35))}
  50%{filter:drop-shadow(0 0 30px rgba(168,104,63,.75))}
}
.modal .tag{color:var(--moss);font-weight:700;font-size:13px;letter-spacing:.08em;margin-bottom:6px}
.modal h2{margin:0 0 6px;font-size:23px;letter-spacing:-.01em}
.modal p{margin:0;color:var(--muted);line-height:1.6;word-break:keep-all}
.modal .time{font-weight:700;color:var(--clay);margin:12px 0 18px;font-variant-numeric:tabular-nums}
.modal .btn{min-width:140px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>「<span>왕실 도자기</span> 맞추기」</h1>
    <p>상주 상판리 가마터에서 나온 파편처럼, 조각을 맞춰 왕실 분청사기를 완성하세요.</p>
  </header>

  <div class="levels" id="levels"></div>

  <div class="hud">
    <div class="stat" id="progress">0 / 0 조각</div>
    <div class="stat">경과 <b id="timer">00:00</b></div>
    <div class="sp"></div>
    <button class="btn" id="soundBtn" type="button" title="소리 설정">🔊 소리·보이스</button>
    <button class="btn" id="hintBtn" type="button">힌트</button>
    <button class="btn" id="shuffleBtn" type="button">다시 섞기</button>
  </div>

  <div class="boardwrap">
    <canvas id="board" aria-label="퍼즐 판"></canvas>
  </div>
  <p class="foot">조각을 끌어다 연한 그림자 위에 놓으면 제자리에서 딱 맞춰집니다. 마우스와 터치 모두 지원합니다.</p>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <img id="doneImg" alt="">
    <div class="tag" id="doneTag"></div>
    <h2 id="doneName"></h2>
    <p id="doneDesc"></p>
    <div class="time" id="doneTime"></div>
    <button class="btn primary" id="nextBtn" type="button">다음 레벨</button>
  </div>
</div>

<script>
(function(){
'use strict';

const LEVELS = [
  { key:'daejeop',   name:'대접',   full:'분청사기 인화문 대접', cols:3, rows:2,
    src:'images/puzzle/level1_daejeop.png',
    desc:'관청 이름을 새겨 궁중에 납품하던 그릇' },
  { key:'hyangno',   name:'향로',   full:'분청사기 향로', cols:3, rows:3,
    src:'images/puzzle/level2_hyangno.png',
    desc:'제사와 의례에 쓰인 왕실용 특수 기종' },
  { key:'jarabyeong',name:'자라병', full:'상감분청 자라병', cols:4, rows:3,
    src:'images/puzzle/level3_jarabyeong.png',
    desc:'전세품으로만 알려졌다가 상판리에서 조각이 처음 출토된 기종' },
];

const IMG = 1024;          // target image size in board units
const SNAP_PX = 25;        // snap tolerance in CSS px

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let dpr = 1, cssW = 0, cssH = 0, scale = 1;     // scale = css px per board unit
let BW = 2000, BH = 1300, TX = 0, TY = 0;       // board size & target origin (units)
let layout = 'wide';

let level = -1, img = null, imgOk = false, pieces = [], edges = null;
let dragging = null, dragOff = {x:0,y:0};
let startTime = 0, endTime = 0, timerId = 0;
let hintUntil = 0;
let cleared = [false,false,false];
let audio = null;

// ---------- utils ----------
const rnd = (a,b) => a + Math.random()*(b-a);
const fmt = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

// ---------- geometry: jittered grid -> sherd polygons ----------
function buildPieces(cols, rows){
  const cw = IMG/cols, ch = IMG/rows, J = 0.24*Math.min(cw,ch);
  // vertices
  const V = [];
  for(let r=0;r<=rows;r++){
    V[r]=[];
    for(let c=0;c<=cols;c++){
      let x=c*cw, y=r*ch;
      const onL=c===0, onR=c===cols, onT=r===0, onB=r===rows;
      if(!(onL||onR)) x += rnd(-J,J);
      if(!(onT||onB)) y += rnd(-J,J);
      V[r][c]={x,y};
    }
  }
  // shared edge intermediate points (2 per edge), keyed by vertex pair
  edges = new Map();
  const ek=(a,b)=>a.r+','+a.c+'|'+b.r+','+b.c;
  function makeEdge(a,b){
    const p=V[a.r][a.c], q=V[b.r][b.c];
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy);
    const nx=-dy/len, ny=dx/len;
    const border = (a.r===b.r && (a.r===0||a.r===rows)) || (a.c===b.c && (a.c===0||a.c===cols));
    const pts=[];
    for(const t of [0.36,0.66]){
      const tt = t + rnd(-0.08,0.08);
      const off = border ? 0 : rnd(-0.13,0.13)*len;
      pts.push({x:p.x+dx*tt+nx*off, y:p.y+dy*tt+ny*off});
    }
    return pts;
  }
  function edgePts(a,b){
    const fwd = (a.r<b.r)||(a.r===b.r && a.c<b.c);
    const A = fwd?a:b, B = fwd?b:a, key=ek(A,B);
    if(!edges.has(key)) edges.set(key, makeEdge(A,B));
    const pts = edges.get(key);
    return fwd ? pts : pts.slice().reverse();
  }
  const out=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const corners=[{r,c},{r,c:c+1},{r:r+1,c:c+1},{r:r+1,c}];
    const poly=[];
    for(let i=0;i<4;i++){
      const a=corners[i], b=corners[(i+1)%4];
      poly.push(V[a.r][a.c]);
      poly.push(...edgePts(a,b));
    }
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(const p of poly){ minx=Math.min(minx,p.x); miny=Math.min(miny,p.y); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); }
    out.push({ r,c, poly, minx,miny, w:maxx-minx, h:maxy-miny,
      x:0,y:0, locked:false, flash:0, cache:null, cacheScale:0 });
  }
  return out;
}

// ---------- layout / resize ----------
function applyLayout(){
  const wrapW = canvas.parentElement.clientWidth - 20;
  cssW = Math.max(300, Math.min(960, wrapW));
  const newLayout = cssW >= 620 ? 'wide' : 'narrow';
  const oldBW=BW, oldBH=BH, oldTX=TX, oldTY=TY, oldLayout=layout;
  layout = newLayout;
  if(layout==='wide'){ BW=2000; BH=1300; TX=(BW-IMG)/2; TY=(BH-IMG)/2; }
  else { BW=1240; BH=2000; TX=(BW-IMG)/2; TY=80; }
  scale = cssW/BW; cssH = BH*scale;
  dpr = Math.min(3, window.devicePixelRatio||1);
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
  if(oldLayout!==layout && pieces.length){
    for(const p of pieces){
      if(p.locked){ p.x=TX+p.minx; p.y=TY+p.miny; }
      else { p.x = p.x/oldBW*BW; p.y = p.y/oldBH*BH; clampPiece(p); }
    }
  }
  for(const p of pieces) p.cache=null; // rebuild at new resolution
}
function clampPiece(p){
  p.x=Math.max(8,Math.min(BW-p.w-8,p.x)); p.y=Math.max(8,Math.min(BH-p.h-8,p.y));
}

// ---------- piece cache (clip + drawImage; no pixel reads) ----------
function pieceCanvas(p){
  const ps = scale*dpr;
  if(p.cache && p.cacheScale===ps) return p.cache;
  const pad = 2;
  const cw = Math.max(1,Math.ceil(p.w*ps)+pad*2), ch = Math.max(1,Math.ceil(p.h*ps)+pad*2);
  const oc = document.createElement('canvas'); oc.width=cw; oc.height=ch;
  const o = oc.getContext('2d');
  o.setTransform(ps,0,0,ps, pad - p.minx*ps, pad - p.miny*ps);
  o.beginPath(); p.poly.forEach((pt,i)=> i?o.lineTo(pt.x,pt.y):o.moveTo(pt.x,pt.y)); o.closePath();
  o.save(); o.clip();
  o.drawImage(img, 0,0,img.naturalWidth,img.naturalHeight, 0,0,IMG,IMG);
  // broken-edge stroke (half of stroke lies inside the clip)
  o.lineJoin='round';
  o.strokeStyle='rgba(74,52,32,0.85)'; o.lineWidth=3.2/scale; o.stroke();
  // thin light line just inside the dark edge (chipped-glaze look)
  o.translate(1.6/scale, 1.6/scale);
  o.beginPath(); p.poly.forEach((pt,i)=> i?o.lineTo(pt.x,pt.y):o.moveTo(pt.x,pt.y)); o.closePath();
  o.strokeStyle='rgba(255,250,240,0.35)'; o.lineWidth=1.2/scale; o.stroke();
  o.restore();
  p.cache=oc; p.cacheScale=ps; p.cachePad=pad/ps;
  return oc;
}

// ---------- render ----------
function render(){
  const now = performance.now();
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.clearRect(0,0,BW,BH);
  ctx.fillStyle = cssVar('--board'); ctx.fillRect(0,0,BW,BH);

  // ghost target
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  ctx.save();
  ctx.fillStyle = dark ? 'rgba(255,255,255,0.03)' : 'rgba(35,33,29,0.035)';
  roundRect(TX-14,TY-14,IMG+28,IMG+28,24); ctx.fill();
  ctx.setLineDash([14,10]); ctx.lineWidth=2/scale;
  ctx.strokeStyle = cssVar('--moss'); ctx.globalAlpha=0.55; ctx.stroke();
  ctx.restore();
  if(imgOk){
    const hint = now < hintUntil;
    ctx.save();
    ctx.globalAlpha = hint ? 0.3 : (dark?0.08:0.10);
    if(!hint) ctx.filter = 'grayscale(1)';
    ctx.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,TX,TY,IMG,IMG);
    ctx.restore();
  } else if(img && img.failed){
    ctx.fillStyle=cssVar('--muted'); ctx.textAlign='center';
    ctx.font = (16/scale)+'px sans-serif';
    ctx.fillText('이미지를 불러올 수 없습니다', TX+IMG/2, TY+IMG/2-14/scale);
    ctx.font = (12/scale)+'px sans-serif';
    ctx.fillText(LEVELS[level].src, TX+IMG/2, TY+IMG/2+14/scale);
  }

  // locked pieces (beneath), then loose pieces (z-order = array order)
  for(const p of pieces) if(p.locked) drawPiece(p,false,now);
  for(const p of pieces) if(!p.locked) drawPiece(p,true,now);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawPiece(p, loose, now){
  if(!imgOk) return;
  const oc = pieceCanvas(p), pad=p.cachePad;
  ctx.save();
  let s=1;
  if(p.flash){ const t=(now-p.flash)/320; if(t<1){ s = 1 + 0.06*Math.sin(t*Math.PI); } else p.flash=0; }
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy);
  if(loose){
    const d = p===dragging;
    ctx.shadowColor='rgba(20,15,10,'+(d?0.42:0.28)+')';
    ctx.shadowBlur=(d?22:9)/scale; ctx.shadowOffsetY=(d?8:3)/scale;
  }
  ctx.drawImage(oc, p.x-pad, p.y-pad, oc.width/(scale*dpr), oc.height/(scale*dpr));
  if(p.flash){
    ctx.shadowColor='transparent';
    ctx.globalAlpha = 0.55*(1-(now-p.flash)/320);
    ctx.beginPath(); p.poly.forEach((pt,i)=>{ const x=pt.x-p.minx+p.x, y=pt.y-p.miny+p.y; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath();
    ctx.fillStyle='#fff8e6'; ctx.fill();
  }
  ctx.restore();
}
function loop(){ render(); requestAnimationFrame(loop); }

// ---------- game flow ----------
function loadLevel(i){
  level=i; const L=LEVELS[i];
  document.querySelectorAll('.lv').forEach((b,k)=>b.classList.toggle('active',k===i));
  pieces = buildPieces(L.cols,L.rows);
  imgOk=false; img = new Image();
  img.onload = ()=>{ imgOk=true; for(const p of pieces) p.cache=null; };
  img.onerror = ()=>{ img.failed=true; };
  img.src = L.src;
  scatter(); startTimer(); updateProgress();
  halfSaid=false;
  say(firstLoad ? ['intro','lv'+(i+1)] : ['lv'+(i+1)]); firstLoad=false;
}
let firstLoad=true;
function scatter(){
  // cancel any drag in progress so a piece can't be locked by a stale pointerup
  dragging=null; canvas.classList.remove('dragging');
  for(const p of pieces){ p.locked=false; p.flash=0; }
  // shuffle z-order (draw order = array order)
  for(let i=pieces.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pieces[i],pieces[j]]=[pieces[j],pieces[i]]; }
  // free zones outside the target: left/right strips (wide) or the tray below (narrow)
  const gap=40;
  const zones = layout==='wide'
    ? [{x:8,y:8,w:TX-gap-8,h:BH-16},{x:TX+IMG+gap,y:8,w:BW-8-(TX+IMG+gap),h:BH-16}]
    : [{x:8,y:TY+IMG+gap,w:BW-16,h:BH-8-(TY+IMG+gap)}];
  const maxW=Math.max(...pieces.map(p=>p.w)), maxH=Math.max(...pieces.map(p=>p.h));
  // deal pieces round-robin into zones, then lay each zone out as a staggered grid:
  // every piece keeps its top-left corner uncovered, so none can hide under another
  const buckets=zones.map(()=>[]);
  pieces.forEach((p,i)=>buckets[i%zones.length].push(p));
  zones.forEach((z,zi)=>{
    const list=buckets[zi], n=list.length; if(!n) return;
    // columns must keep a stride of at least 35% of a piece width, or later pieces cover earlier ones
    const maxCols=Math.max(1,Math.floor((z.w-maxW)/(0.35*maxW))+1);
    const cols=Math.max(1,Math.min(n,maxCols,Math.ceil(Math.sqrt(n*z.w/z.h)))), rows=Math.ceil(n/cols);
    const sx = cols>1 ? Math.max(0,(z.w-maxW)/(cols-1)) : 0;
    const sy = rows>1 ? Math.max(0,(z.h-maxH)/(rows-1)) : 0;
    list.forEach((p,i)=>{
      const c=i%cols, r=Math.floor(i/cols);
      const jx=Math.min(sx,maxW)*0.25, jy=Math.min(sy,maxH)*0.25;
      p.x = z.x + c*sx + (cols>1 ? 0 : rnd(0,Math.max(0,z.w-p.w))) + rnd(-jx,jx);
      p.y = z.y + r*sy + (rows>1 ? 0 : rnd(0,Math.max(0,z.h-p.h))) + rnd(-jy,jy);
      clampPiece(p);
    });
  });
}
function startTimer(){
  clearInterval(timerId); startTime=performance.now(); endTime=0;
  $('timer').textContent='00:00';
  timerId=setInterval(()=>{ $('timer').textContent=fmt(performance.now()-startTime); },250);
}
function updateProgress(){
  const n=pieces.filter(p=>p.locked).length;
  $('progress').innerHTML = `<b>${n}</b> / ${pieces.length} 조각`;
}
function complete(){
  clearInterval(timerId); endTime=performance.now();
  cleared[level]=true; renderLevelButtons();
  const last = level===LEVELS.length-1;
  playSfx('complete');
  if(last){ setTimeout(()=>playSfx('allclear',0.9),700); say(['done3','allclear']); }
  else say('done'+(level+1));
  const L=LEVELS[level];
  $('doneImg').src=L.src; $('doneImg').alt=L.full;
  $('doneTag').textContent='레벨 '+(level+1)+' 완성';
  $('doneName').textContent=L.full;
  $('doneDesc').textContent=L.desc;
  $('doneTime').textContent='걸린 시간 '+fmt(endTime-startTime);
  $('nextBtn').textContent = level===LEVELS.length-1 ? '처음부터' : '다음 레벨';
  setTimeout(()=>$('overlay').classList.add('show'), 420);
}
function renderLevelButtons(){
  const box=$('levels'); box.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button'); b.type='button';
    b.className='lv'+(i===level?' active':'')+(cleared[i]?' cleared':'');
    b.innerHTML=`<b>레벨 ${i+1} · ${L.name}</b><small>${L.cols*L.rows}조각</small>`;
    b.addEventListener('click',()=>{ $('overlay').classList.remove('show'); loadLevel(i); });
    box.appendChild(b);
  });
}

// ---------- audio: ElevenLabs 효과음 + 한국어 보이스 ----------
// 파일은 tools/gen_audio.py 로 생성. 모드 2=효과음+보이스, 1=효과음만, 0=무음
const AUDIO_BASE='audio/';
const SFX_NAMES=['pickup','snap','miss','shuffle','hint','complete','allclear'];
const VOICE_NAMES=['intro','lv1','lv2','lv3','half','hint','shuffle','done1','done2','done3','allclear'];
const sfx={}, voice={};
const mkAudio=f=>{ const a=new Audio(AUDIO_BASE+f+'.mp3'); a.preload='auto'; return a; };
SFX_NAMES.forEach(n=>sfx[n]=mkAudio(n));
VOICE_NAMES.forEach(n=>voice[n]=mkAudio('v_'+n));
let soundMode=2;
try{ const s=localStorage.getItem('puzzle.sound'); if(s!==null) soundMode=+s; }catch(e){}
let unlocked=false, curVoice=null, voiceQueue=[], pendingVoice=null, halfSaid=false;

function playSfx(n, vol=1){
  if(soundMode<1) return;
  const a=sfx[n]; if(!a || a.error){ if(n==='snap') click(); return; }
  try{ const c=a.cloneNode(); c.volume=vol; c.play().catch(()=>{}); }catch(e){}
}
function stopVoice(){ voiceQueue=[]; if(curVoice){ curVoice.pause(); curVoice.currentTime=0; curVoice=null; } }
function playNextVoice(){
  curVoice=null;
  const n=voiceQueue.shift(); if(!n) return;
  const a=voice[n]; if(!a || a.error){ playNextVoice(); return; }
  curVoice=a; a.currentTime=0; a.onended=playNextVoice;
  a.play().catch(()=>{ playNextVoice(); });
}
// say('x') 또는 say(['a','b']): 진행 중인 말은 끊고 새 대사를 차례로 재생
function say(names){
  if(soundMode<2) return;
  const list=Array.isArray(names)?names:[names];
  if(!unlocked){ pendingVoice=list; return; }   // 브라우저 자동재생 정책: 첫 클릭 뒤에 재생
  stopVoice(); voiceQueue=list.slice(); playNextVoice();
}
function unlockAudio(){
  if(unlocked) return; unlocked=true;
  if(pendingVoice){ const l=pendingVoice; pendingVoice=null; say(l); }
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);
function renderSoundBtn(){
  $('soundBtn').textContent = ['🔇 무음','🔉 효과음만','🔊 소리·보이스'][soundMode];
  $('soundBtn').setAttribute('aria-label','소리 설정: '+['무음','효과음만','효과음과 보이스'][soundMode]);
}
$('soundBtn').addEventListener('click', ()=>{
  soundMode=(soundMode+2)%3;      // 2 → 1 → 0 → 2
  try{ localStorage.setItem('puzzle.sound',soundMode); }catch(e){}
  if(soundMode<2){ stopVoice(); pendingVoice=null; }
  renderSoundBtn();
  if(soundMode>=1) playSfx('snap',0.8);
});
renderSoundBtn();

// 오디오 파일이 없을 때(오프라인 복사본 등) 쓰는 대체 클릭음
function click(){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
    const t=audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(1400,t); o.frequency.exponentialRampToValueAtTime(700,t+0.06);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+0.1);
  }catch(e){}
}

// ---------- pointer input ----------
function toUnits(e){
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale };
}
canvas.addEventListener('pointerdown', e=>{
  if(!imgOk) return;
  const u=toUnits(e);
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    if(p.locked) continue;
    if(pointInPoly(u.x-p.x+p.minx, u.y-p.y+p.miny, p.poly)){
      dragging=p; dragOff={x:u.x-p.x, y:u.y-p.y};
      playSfx('pickup',0.7);
      pieces.splice(i,1); pieces.push(p);   // bring to top
      canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
      e.preventDefault(); return;
    }
  }
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const u=toUnits(e);
  dragging.x=u.x-dragOff.x; dragging.y=u.y-dragOff.y;
  clampPiece(dragging);
  e.preventDefault();
});
function endDrag(e){
  if(!dragging) return;
  const p=dragging; dragging=null; canvas.classList.remove('dragging');
  const tx=TX+p.minx, ty=TY+p.miny, tol=SNAP_PX/scale;
  if(Math.hypot(p.x-tx,p.y-ty)<=tol){
    p.x=tx; p.y=ty; p.locked=true; p.flash=performance.now();
    playSfx('snap'); updateProgress();
    const n=pieces.filter(q=>q.locked).length;
    if(n===pieces.length) complete();
    else if(!halfSaid && n>=Math.ceil(pieces.length/2)){ halfSaid=true; say('half'); }
  } else {
    playSfx('miss',0.6);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---------- buttons ----------
$('hintBtn').addEventListener('click', ()=>{ hintUntil=performance.now()+2000; playSfx('hint'); say('hint'); });
$('shuffleBtn').addEventListener('click', ()=>{ scatter(); startTimer(); updateProgress(); halfSaid=false; playSfx('shuffle'); say('shuffle'); });
$('nextBtn').addEventListener('click', ()=>{
  $('overlay').classList.remove('show');
  loadLevel(level===LEVELS.length-1 ? 0 : level+1);
});

// ---------- boot ----------
let rt=0;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(applyLayout,80); });
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change', ()=>{ for(const p of pieces) p.cache=null; });
applyLayout();
renderLevelButtons();
loadLevel(0);
loop();
window.__puzzle = { get pieces(){return pieces;}, get TX(){return TX;}, get TY(){return TY;}, get scale(){return scale;}, get level(){return level;} };
})();
</script>
</body>
